/* board */
.brd{position:relative;width:100%;aspect-ratio:1;background:#fff;container-type:inline-size;box-shadow:0 14px 40px #000a,0 0 0 3px #fff}
.brd.rot{transform:rotate(180deg)}
.bs{position:absolute;width:40%;height:40%}
.bs i{position:absolute;inset:16.67%;background:#fff;box-shadow:inset 0 0 0 1px #0002}
.sl{position:absolute;width:7.667%;height:7.667%;border-radius:50%;box-shadow:inset 0 -2px 0 #0003,0 1px 0 #fff8}
.tc{position:absolute;width:6.667%;height:6.667%;border:.5px solid #8b95a8;background:#fff;display:flex;align-items:center;justify-content:center;font-size:5.8cqw;line-height:1;color:#7b8190}
.tc.ar{font-size:5.2cqw;font-weight:700}
.ctr{position:absolute;left:40%;top:40%;width:20%;height:20%;background:conic-gradient(from -45deg,#00a650 0 25%,#ffe01b 0 50%,#1ea5f0 0 75%,#ed1c24 0);box-shadow:0 0 0 .5px #0006}

.nm.t1{transform:rotate(180deg)}

/* pin pieces */
.pc{position:absolute;left:0;top:0;width:6.667%;height:6.667%;transform-origin:50% 100%;transition:transform .13s linear;pointer-events:none;will-change:transform}
.pc svg{position:absolute;left:0;bottom:6%;width:100%;height:135%;overflow:visible;filter:drop-shadow(0 1px 1.5px #0008)}
.brd.rot .pc svg{bottom:auto;top:6%;transform:rotate(180deg)}
.pc.mv{pointer-events:auto;cursor:pointer}
.pc.mv:before{content:'';position:absolute;inset:-40%}
.pc.mv:after{content:'';position:absolute;inset:-6%;border-radius:50%;border:2.5px solid #ffe14a;box-shadow:0 0 10px #ffe14a;animation:rg 1s ease-in-out infinite}
.pc.mv svg{animation:hop .55s ease-in-out infinite}
.brd.rot .pc.mv svg{animation-name:hop2}
@keyframes hop{50%{translate:0 -14%}}@keyframes hop2{50%{translate:0 14%}}
@keyframes rg{50%{transform:scale(1.25);opacity:.4}}

/* player panels */
.pbar{display:flex;align-items:center;gap:10px;min-height:66px}
.pbar.top{justify-content:flex-end}
.pp{position:relative;display:flex;align-items:center;gap:6px;padding:4px;border:3px solid #f5c518;border-radius:13px;background:linear-gradient(90deg,#0a3fb0,#1565e0 60%,#2d7ff0);box-shadow:0 5px 14px #0007;transition:box-shadow .2s}
.pp.on{box-shadow:0 0 0 2px #fff7,0 0 24px #f5c518cc,0 5px 14px #0007}
.pk{width:40px;height:46px;display:flex;align-items:center;justify-content:center}
.pk svg{width:34px;height:46px}
.dbox{width:58px;height:58px;padding:6px;border-radius:12px;border:3px solid #f5c518;background:linear-gradient(#fdeaea,#e5b3b3);flex:none}
#dbBot{cursor:pointer}
.dbox.go{animation:pl 1s ease-in-out infinite}
.tm{position:absolute;left:6px;right:6px;bottom:-11px;height:4px;border-radius:2px;background:#0006;overflow:hidden}
.tm i{display:block;height:100%;width:0;background:#4ade80;transition:width 1s linear}
.ar{width:36px;height:36px;background:linear-gradient(90deg,#ff9800,#ffd54f);clip-path:polygon(0 50%,46% 0,46% 28%,100% 28%,100% 72%,46% 72%,46% 100%);filter:drop-shadow(0 2px 2px #0008);animation:nu .7s ease-in-out infinite;opacity:0;transition:opacity .2s}

#hint{text-align:center;min-height:24px;font-weight:800;font-size:14px;text-shadow:0 1px 3px #000a}

/* dice */
.dc{width:100%;height:100%;border-radius:22%;background:linear-gradient(145deg,#fff,#d6dbe2);box-shadow:inset 0 -3px 0 #0002,0 2px 4px #0006;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:15%;place-items:center}
.dc b{width:74%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#555,#000 65%);visibility:hidden}
.dc.d1 b:nth-child(5),.dc.d2 b:is(:nth-child(1),:nth-child(9)),.dc.d3 b:is(:nth-child(1),:nth-child(5),:nth-child(9)),.dc.d4 b:is(:nth-child(1),:nth-child(3),:nth-child(7),:nth-child(9)),.dc.d5 b:is(:nth-child(1),:nth-child(3),:nth-child(5),:nth-child(7),:nth-child(9)),.dc.d6 b:is(:nth-child(1),:nth-child(3),:nth-child(4),:nth-child(6),:nth-child(7),:nth-child(9)){visibility:visible}

  if(c.to>c.f&&c.f>=0){e._mv=1;e.style.zIndex=40;for(let r=c.f+1;r<=c.to;r++){shown[c.t][c.i]=r;e.style.transitionDuration='.14s';layout();hop(e);SFX.step(r-c.f);if(r==c.to&&r<=50&&SAFE.has((OFF[c.t]+r)%52))setTimeout(()=>SFX.safe(),120);await sleep(145)}e._mv=0;if(c.to==56){SFX.home();if(navigator.vibrate)navigator.vibrate(80)}}

  if(nr<=50){const a=(OFF[t]+nr)%52;if(!SAFE.has(a))pcs[o].forEach((x,j)=>{if(x>=0&&x<=50&&(OFF[o]+x)%52==a){pcs[o][j]=-1;cap=true}})}
